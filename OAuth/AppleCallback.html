<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Sign In - PocketFence</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .callback-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .callback-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4C6EF5;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .message { margin-top: 1.5rem; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="callback-card">
            <div class="spinner" id="spinner"></div>
            <h1 id="status">Processing Sign In...</h1>
            <p class="message" id="message">Please wait while we complete your authentication.</p>
        </div>
    </div>

    <script>
        // Parse OAuth response from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        async function handleCallback() {
            const spinner = document.getElementById('spinner');
            const status = document.getElementById('status');
            const message = document.getElementById('message');
            
            if (error) {
                spinner.style.display = 'none';
                status.className = 'error';
                status.textContent = 'Sign In Failed';
                message.textContent = Error: ${error}. Please try again.;
                setTimeout(() => window.location.href = '/', 3000);
                return;
            }
            
            if (!code) {
                spinner.style.display = 'none';
                status.className = 'error';
                status.textContent = 'Invalid Request';
                message.textContent = 'No authorization code received.';
                setTimeout(() => window.location.href = '/', 3000);
                return;
            }
            
            try {
                // Send code to your backend dashboard
                const response = await fetch('https://pocketfence.net:5000/OAuth/AppleCallback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code, state }),
                    credentials: 'include'
                });
                
                if (response.ok) {
                    spinner.style.display = 'none';
                    status.className = 'success';
                    status.textContent = 'Sign In Successful!';
                    message.textContent = 'Redirecting to your dashboard...';
                    setTimeout(() => window.location.href = 'https://pocketfence.net:5000', 1500);
                } else {
                    throw new Error('Authentication failed');
                }
            } catch (err) {
                spinner.style.display = 'none';
                status.className = 'error';
                status.textContent = 'Connection Error';
                message.textContent = 'Unable to connect to dashboard. Please try again.';
                console.error(err);
                setTimeout(() => window.location.href = '/', 3000);
            }
        }
        
        // Start processing
        handleCallback();
    </script>
</body>
</html>
